<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 웹앱 모음</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 커스텀 스크롤바 디자인 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 selection:bg-indigo-200">
    <div class="max-w-5xl mx-auto px-4 py-12">
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 mb-4">
                나만의 웹앱 모음
            </h1>
            <p class="text-slate-500 text-lg">자주 사용하는 웹앱을 등록하고 한 번의 클릭으로 편리하게 접속하세요.</p>
        </header>

        <section class="bg-white rounded-2xl shadow-xl p-6 md:p-8 mb-12 border border-slate-100">
            <h2 class="text-2xl font-bold mb-6 text-slate-700">새 웹앱 등록</h2>
            <form id="add-app-form" class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <label for="app-name" class="block text-sm font-semibold text-slate-600 mb-2">웹앱 이름</label>
                    <input type="text" id="app-name" required placeholder="예: 구글, 네이버" 
                        class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white transition-all">
                </div>
                <div class="flex-1">
                    <label for="app-url" class="block text-sm font-semibold text-slate-600 mb-2">웹앱 주소(URL)</label>
                    <input type="text" id="app-url" required placeholder="예: google.com" 
                        class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white transition-all">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full md:w-auto px-8 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all">
                        등록하기
                    </button>
                </div>
            </form>
        </section>

        <section>
            <div class="flex justify-between items-end mb-6">
                <h2 class="text-2xl font-bold text-slate-700">등록된 웹앱 목록</h2>
                <span id="app-count" class="text-sm font-medium px-3 py-1 bg-slate-200 text-slate-600 rounded-full">총 0개</span>
            </div>
            
            <div id="app-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- 웹앱 카드가 여기에 동적으로 추가됩니다 -->
            </div>

            <div id="empty-state" class="hidden text-center py-20 bg-white rounded-2xl shadow-sm border border-slate-100 border-dashed">
                <svg class="w-16 h-16 text-slate-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <p class="text-slate-500 text-lg">등록된 웹앱이 없습니다.<br>위에서 자주 가는 사이트를 등록해보세요!</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
